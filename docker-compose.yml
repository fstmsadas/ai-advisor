version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: myapp-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  python-app:
    image: myapp-v2:latest
    container_name: myapp-python
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DB_HOST: 192.168.31.244
      DB_PORT: 3306
      DB_USER: container_user
      DB_PASSWORD: YourPass123!
      DB_NAME: myapp
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-net

networks:
  app-net:
