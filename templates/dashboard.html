<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统聚合监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        .card-stats { border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; background: white; height: 100%; }
        .card-title { font-size: 1rem; color: #6c757d; }
        .card-value { font-size: 2rem; font-weight: 700; color: #2c3e50; }
        .card-sub { font-size: 0.9rem; color: #6c757d; }
        .chart-container { height: 300px; background: white; border-radius: 16px; padding: 15px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📊 系统聚合监控</h1>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>

        <!-- 指标卡片 -->
        <div class="row g-4" id="metricCards">
            <div class="col-md-3">
                <div class="card-stats">
                    <div class="card-title">CPU 使用率</div>
                    <div class="card-value" id="cpuValue">--%</div>
                    <div class="card-sub">负载: <span id="loadAvg">--</span></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats">
                    <div class="card-title">内存使用率</div>
                    <div class="card-value" id="memValue">--%</div>
                    <div class="card-sub">可用: <span id="memAvailable">--</span></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats">
                    <div class="card-title">磁盘使用率</div>
                    <div class="card-value" id="diskValue">--%</div>
                    <div class="card-sub">读写: <span id="diskIO">--</span></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card-stats">
                    <div class="card-title">网络连接数</div>
                    <div class="card-value" id="netValue">--</div>
                    <div class="card-sub">TCP: <span id="tcpCount">--</span> | UDP: <span id="udpCount">--</span></div>
                </div>
            </div>
        </div>

        <!-- ECharts 趋势图 -->
        <div class="chart-container">
            <div id="trendChart" style="width:100%;height:100%;"></div>
        </div>
        <div class="text-center text-muted mt-3">数据每5秒自动刷新</div>
    </div>

    <script>
        // 初始化图表
        var chartDom = document.getElementById('trendChart');
        var myChart = echarts.init(chartDom);
        var option = {
            title: { text: 'CPU & 内存历史趋势' },
            tooltip: { trigger: 'axis' },
            legend: { data: ['CPU %', '内存 %'] },
            xAxis: { type: 'category', data: [] },
            yAxis: { type: 'value', min: 0, max: 100 },
            series: [
                { name: 'CPU %', type: 'line', smooth: true, data: [] },
                { name: '内存 %', type: 'line', smooth: true, data: [] }
            ]
        };
        myChart.setOption(option);

        // 更新所有数据（图表 + 卡片）
        function fetchAll() {
            // 1. 获取历史趋势数据
            fetch('/api/trend_all?limit=60')
                .then(res => res.json())
                .then(data => {
                    if (data.code !== 0) return;
                    const d = data.data;
                    myChart.setOption({
                        xAxis: { data: d.timestamps },
                        series: [
                            { data: d.cpu_values },
                            { data: d.memory_values }
                        ]
                    });
                })
                .catch(err => console.error('Trend API error:', err));

            // 2. 获取当前聚合数据（卡片）
            fetch('/api/metrics')
                .then(res => res.json())
                .then(data => {
                    if (data.code !== 0) return;
                    const d = data.data;
                    document.getElementById('cpuValue').textContent = d.cpu_percent + '%';
                    document.getElementById('loadAvg').textContent = '--';
                    document.getElementById('memValue').textContent = d.memory.percent + '%';
                    document.getElementById('memAvailable').textContent = (d.memory.available / (1024 * 1024)).toFixed(0) + ' MB';
                    document.getElementById('diskValue').textContent = d.disk.usage_percent + '%';
                    document.getElementById('diskIO').textContent = `读:${(d.disk.read_bytes / 1024 / 1024).toFixed(1)}MB 写:${(d.disk.write_bytes / 1024 / 1024).toFixed(1)}MB`;
                    document.getElementById('netValue').textContent = d.network.total_connections;
                    document.getElementById('tcpCount').textContent = d.network.tcp_connections;
                    document.getElementById('udpCount').textContent = d.network.udp_connections;
                })
                .catch(err => console.error('Metrics API error:', err));
        }

        // 首次加载
        fetchAll();

        // 每5秒轮询刷新
        setInterval(fetchAll, 5000);
    </script>
</body>
</html>
