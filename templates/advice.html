<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 优化建议</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 30px; }
        .table th { background-color: #2c3e50; color: white; }
        .advice-text { max-width: 400px; word-wrap: break-word; }
        .footer { margin-top: 30px; text-align: center; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">💡 AI 优化建议历史</h1>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>CPU (%)</th>
                        <th>建议内容</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in advices %}
                    <tr>
                        <td>{{ item.id }}</td>
                        <td>
                            <span class="badge {% if item.cpu_percent > 80 %}bg-danger{% elif item.cpu_percent > 60 %}bg-warning{% else %}bg-success{% endif %}">
                                {{ item.cpu_percent }}%
                            </span>
                        </td>
                        <td class="advice-text">{{ item.advice_text }}</td>
                        <td>{{ item.created_at }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center">暂无建议</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="footer">
            <p>显示最近 {{ advices|length }} 条建议</p>
            <a href="/" class="btn btn-outline-secondary btn-sm">返回首页</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
