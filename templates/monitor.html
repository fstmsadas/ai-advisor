<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控数据</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 30px; }
        .table th { background-color: #2c3e50; color: white; }
        .badge { font-size: 0.9rem; }
        .footer { margin-top: 30px; text-align: center; color: #6c757d; }
        .diagnosis-box {
            background: #f1f8ff;
            border-left: 4px solid #007bff;
            padding: 15px 20px;
            border-radius: 6px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="btn btn-outline-secondary btn-sm">🏠 返回首页</a>
            <button id="diagnoseBtn" class="btn btn-primary">
                🧠 AI 诊断
            </button>
        </div>
        <h1 class="text-center mb-4">📊 系统实时监控</h1>

        <!-- 诊断结果展示区域 -->
        <div id="diagnosisArea" style="display: none;">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    🤖 AI 诊断报告
                    <span id="diagnosisTime" class="badge bg-light text-dark float-end"></span>
                    <span id="cacheBadge" class="badge bg-secondary float-end me-2">缓存</span>
                </div>
                <div class="card-body">
                    <div id="diagnosisContent" class="diagnosis-box"></div>
                </div>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>CPU (%)</th>
                        <th>内存 (%)</th>
                        <th>磁盘 (%)</th>
                        <th>负载</th>
                        <th>时间戳</th>
                    </tr>
                </thead>
                <tbody>
                    {% for metric in metrics %}
                    <tr>
                        <td>{{ metric.id }}</td>
                        <td>
                            <span class="badge {% if metric.cpu_percent > 80 %}bg-danger{% elif metric.cpu_percent > 60 %}bg-warning{% else %}bg-success{% endif %}">
                                {{ metric.cpu_percent }}%
                            </span>
                        </td>
                        <td>
                            <span class="badge {% if metric.memory_percent > 80 %}bg-danger{% elif metric.memory_percent > 60 %}bg-warning{% else %}bg-success{% endif %}">
                                {{ metric.memory_percent }}%
                            </span>
                        </td>
                        <td>
                            <span class="badge {% if metric.disk_usage > 80 %}bg-danger{% elif metric.disk_usage > 60 %}bg-warning{% else %}bg-success{% endif %}">
                                {{ metric.disk_usage }}%
                            </span>
                        </td>
                        <td>{{ metric.load_avg }}</td>
                        <td>{{ metric.timestamp }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" class="text-center">暂无数据</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="footer">
            <p>显示最近 {{ metrics|length }} 条记录</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const diagnoseBtn = document.getElementById('diagnoseBtn');
            const diagnosisArea = document.getElementById('diagnosisArea');
            const diagnosisContent = document.getElementById('diagnosisContent');
            const diagnosisTime = document.getElementById('diagnosisTime');
            const cacheBadge = document.getElementById('cacheBadge');

            diagnoseBtn.addEventListener('click', function() {
                // 禁用按钮，防止重复点击
                diagnoseBtn.disabled = true;
                diagnoseBtn.textContent = '⏳ 诊断中...';

                fetch('/api/diagnose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0) {
                        // 显示诊断结果
                        diagnosisArea.style.display = 'block';
                        diagnosisContent.textContent = data.data.diagnosis;
                        diagnosisTime.textContent = new Date(data.data.timestamp).toLocaleString();
                        cacheBadge.textContent = data.data.cached ? '✅ 缓存命中' : '🆕 新生成';
                        cacheBadge.className = data.data.cached ? 'badge bg-success float-end me-2' : 'badge bg-warning text-dark float-end me-2';
                    } else {
                        alert('诊断失败: ' + data.msg);
                    }
                })
                .catch(error => {
                    alert('请求异常: ' + error);
                })
                .finally(() => {
                    diagnoseBtn.disabled = false;
                    diagnoseBtn.textContent = '🧠 AI 诊断';
                });
            });
        });
    </script>
</body>
</html>
