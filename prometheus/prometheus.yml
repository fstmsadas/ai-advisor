global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']   # 若使用 Alertmanager（可选）

rule_files:
  - "/etc/prometheus/alert.rules"

scrape_configs:
  - job_name: 'python-app'
    static_configs:
      - targets: ['python-app:8000']
    metrics_path: '/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
